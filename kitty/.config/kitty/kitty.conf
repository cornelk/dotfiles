# Blue dark, tuned to match the i3/polybar desktop.

font_family DejaVu Sans Mono
font_size 10.0

background #1d2021
foreground #dbeafe
cursor #60a5fa
cursor_text_color #1d2021

selection_background #1e3a5f
selection_foreground #dbeafe

url_color #93c5fd

active_border_color #3b82f6
inactive_border_color #334155
bell_border_color #38bdf8

active_tab_background #2563eb
active_tab_foreground #dbeafe
inactive_tab_background #282828
inactive_tab_foreground #94a3b8

color0 #282828
color1 #cc241d
color2 #98971a
color3 #2563eb
color4 #3b82f6
color5 #b16286
color6 #689d6a
color7 #94a3b8

color8 #64748b
color9 #fb4934
color10 #b8bb26
color11 #60a5fa
color12 #93c5fd
color13 #d3869b
color14 #8ec07c
color15 #dbeafe

window_padding_width 6
tab_bar_style powerline
enable_audio_bell no
window_alert_on_bell no
bell_on_tab no
filter_notification all
notify_on_cmd_finish never
copy_on_select yes
map ctrl+v paste_from_clipboard
