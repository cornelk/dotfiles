[colors]
background = #282828
foreground = #ebdbb2
primary = #458588
secondary = #689d6a
alert = #cc241d

[bar/main]
width = 100%
height = 22
bottom = true
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
padding-right = 1
module-margin = 1

font-0 = DejaVu Sans Mono:size=8;1
font-1 = Font Awesome 6 Free Solid:size=10;2
font-2 = Font Awesome 6 Brands:size=10;2

modules-left = i3-custom xwindow
modules-center = date
modules-right = memory swap cpu network-wired network-wifi keyboard

tray-position = right
tray-padding = 2

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
pin-workspaces = false
show-urgent = true
enable-click = true
enable-scroll = true
reverse-scroll = false
strip-wsnumbers = false

ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-9 = 10;

label-focused = %index% %icon%
label-focused-background = ${colors.primary}
label-focused-padding = 2
label-unfocused = %index% %icon%
label-unfocused-padding = 2
label-visible = %index% %icon%
label-visible-padding = 2
label-urgent = %index% %icon%
label-urgent-background = ${colors.alert}
label-urgent-padding = 2
label-empty = %index% %icon%
label-empty-foreground = #666666
label-empty-padding = 2

[module/i3-custom]
type = custom/script
exec = ~/.config/polybar/i3_workspaces.sh
interval = 1
format = <label>
label = %output%

[module/xwindow]
type = internal/xwindow
label = %title:0:70:...%
label-padding = 1

[module/date]
type = internal/date
interval = 10
date = %Y-%m-%d
time = %H:%M
label = %date% %time%

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume = VOL %percentage%%
label-muted = MUTED

[module/memory]
type = internal/memory
interval = 3
label = MEM %percentage_used%%

[module/swap]
type = internal/memory
interval = 3
label = SWAP %percentage_swap_used%%

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
label-charging = CHG %percentage%%
label-discharging = BAT %percentage%%
label-full = FULL

[module/network-wired]
type = internal/network
interface-type = wired
interval = 3
label-connected = %linkspeed%
label-disconnected =

[module/network-wifi]
type = internal/network
interface-type = wireless
interval = 3
label-connected = %essid% %signal%%
label-disconnected =

[module/keyboard]
type = internal/xkeyboard
format = <label-layout>
label-layout = %layout%
